name: Pipeline diario
on:
  schedule:
    - cron: "0 7 * * *"     # todos los días a las 7:00 UTC
  workflow_dispatch:         # botón para lanzarlo a mano
jobs:
  run:
    runs-on: ubuntu-latest   # máquina Linux de GitHub
    steps:
      - uses: actions/checkout@v4          # descarga tu repo
      - uses: actions/setup-python@v5      # instala Python
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py && python informe.py
      - uses: actions/upload-artifact@v4   # guarda el Excel para descargarlo
        with:
          name: informe
          path: informe.xlsx